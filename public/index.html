<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Claude Remote</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922;
}
body { background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.header h1 { font-size:16px; font-weight:600; }
.header-actions { display:flex; gap:8px; align-items:center; }
.btn { padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; cursor:pointer; white-space:nowrap; }
.btn:active { opacity:0.7; }
.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-danger { background:var(--red); color:#fff; border-color:var(--red); }
.status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.status-dot.running { background:var(--green); }
.status-dot.stopped { background:var(--red); }

/* Activity indicator in the header — shows whether the terminal is
   currently receiving data from the backend (i.e. Claude is talking) */
.activity-dot {
  width:10px; height:10px; border-radius:50%; display:inline-block;
  background:#30363d; transition:background .2s, box-shadow .2s;
  flex-shrink:0;
}
.activity-dot.active {
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:activity-pulse 1s ease-in-out infinite;
}
@keyframes activity-pulse {
  0%,100% { opacity:1; }
  50%     { opacity:0.35; }
}

/* Floating "new output" pill — appears when the user has scrolled up
   and new data arrives. Tap it to jump back to the bottom. */
.scroll-pill {
  position:absolute; right:12px; bottom:12px; z-index:10;
  background:var(--accent); color:#fff;
  padding:9px 16px; border-radius:20px;
  font-size:13px; font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
  cursor:pointer; display:none;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  border:none;
}
.scroll-pill.show { display:block; animation:pill-in .18s ease-out; }
.scroll-pill:active { transform:scale(0.94); }
@keyframes pill-in {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}

/* Session list */
.sessions-bar { display:flex; gap:4px; padding:6px 12px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; flex-shrink:0; -webkit-overflow-scrolling:touch; }
.session-tab { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text2); font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px; white-space:nowrap; flex-shrink:0; }
.session-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.session-tab .close-btn { font-size:14px; line-height:1; opacity:0.6; margin-left:2px; }

/* Terminal */
.terminal-wrap { flex:1; overflow:hidden; position:relative; }
#terminal { height:100%; touch-action:pan-y; }

/* Enable momentum scrolling and GPU compositing for xterm's internal viewport.
   xterm renders its scrollable area into .xterm-viewport; without these hints
   mobile Safari/Chrome paints every frame on the main thread → laggy. */
.xterm .xterm-viewport {
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  will-change: transform;
}
.xterm .xterm-screen { will-change: transform; }

/* Input bar */
.input-bar { padding:6px 8px calc(max(env(safe-area-inset-bottom), 10px) + 6px); background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; }

/* Primary nav row — big arrow keys + Enter for Claude menu selection */
.nav-row { display:flex; gap:6px; margin-bottom:6px; }
.nav-btn {
  flex:1; min-width:0; padding:12px 0; border-radius:8px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:18px; line-height:1; cursor:pointer;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  transition:background .08s, border-color .08s, transform .08s;
}
.nav-btn.pressed { background:var(--accent); color:#fff; border-color:var(--accent); transform:scale(0.96); }
.nav-btn.enter { flex:1.4; font-size:14px; font-weight:600; }

/* Secondary small key row (tab / esc / ctrl-c / shift-tab) */
.key-btns { display:flex; gap:4px; margin-bottom:6px; flex-wrap:wrap; }
/* TTS row — own line so nothing has to scroll */
.speak-row { display:none; gap:4px; margin-bottom:6px; }
.speak-row.show { display:flex; }
.speak-row .key-btn { flex:1; text-align:center; }
.key-btn {
  padding:6px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg); color:var(--text2); font-size:13px; cursor:pointer;
  white-space:nowrap; flex-shrink:0;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
.key-btn.pressed { background:var(--accent); color:#fff; border-color:var(--accent); }
.input-row { display:flex; gap:6px; align-items:stretch; }
.input-row textarea {
  flex:1; padding:10px 12px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:16px; font-family:monospace;
  resize:none; line-height:1.4; min-height:40px; max-height:120px;
  -webkit-user-select:text; user-select:text;
}
.input-row textarea:focus { outline:none; border-color:var(--accent); }

/* Refresh button in key-btns row — larger + accent color so it stands out */
.key-btn.refresh-btn {
  background:var(--yellow); color:#000; border-color:var(--yellow);
  font-weight:600; padding:6px 14px; margin-left:auto;
}
.key-btn.refresh-btn:active { opacity:0.75; }

/* TTS buttons */
.key-btn.speak-btn {
  background:var(--accent); color:#fff; border-color:var(--accent);
  font-weight:600;
}
.key-btn.speak-btn:disabled { opacity:0.6; }
.key-btn.stop-btn {
  background:var(--red); color:#fff; border-color:var(--red);
  font-weight:600;
}

/* TTS preview panel — sits above the input bar. Shows the text that's
   being read aloud plus a native <audio> element (play / pause / seek). */
.tts-panel {
  display:none; flex-direction:column; gap:6px;
  background:var(--surface); border-top:1px solid var(--border);
  padding:8px 10px; flex-shrink:0;
}
.tts-panel.show { display:flex; }
.tts-head { display:flex; justify-content:space-between; align-items:center; }
.tts-head .tts-label { font-size:13px; font-weight:600; color:var(--accent); }
.tts-head .tts-status { font-size:11px; color:var(--text2); margin-left:8px; }
.tts-close {
  background:transparent; border:none; color:var(--text2);
  font-size:16px; cursor:pointer; padding:0 6px; line-height:1;
}
.tts-text {
  font-size:13px; color:var(--text); line-height:1.45;
  white-space:pre-wrap; word-break:break-word;
  max-height:20vh; overflow-y:auto;
  background:var(--bg); border:1px solid var(--border);
  border-radius:6px; padding:6px 8px;
}
#tts-audio { width:100%; height:32px; }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; padding:16px; }
.modal-overlay.show { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; width:100%; max-width:400px; }
.modal h2 { font-size:18px; margin-bottom:16px; }
.modal label { display:block; font-size:13px; color:var(--text2); margin-bottom:4px; margin-top:12px; }
.modal input[type="text"] { width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
.modal input:focus { outline:none; border-color:var(--accent); }
.modal-actions { display:flex; gap:8px; margin-top:20px; justify-content:flex-end; }
.toggle-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.toggle { width:44px; height:24px; border-radius:12px; background:var(--border); position:relative; cursor:pointer; border:none; }
.toggle.on { background:var(--accent); }
.toggle::after { content:''; width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .2s; }
.toggle.on::after { left:22px; }

/* Empty state */
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); gap:12px; }
.empty-state .icon { font-size:48px; }

/* Responsive */
@media (max-width:480px) {
  .header h1 { font-size:14px; }
  .btn { padding:5px 8px; font-size:12px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Claude Remote</h1>
  <div class="header-actions">
    <span id="activity-dot" class="activity-dot" title="Idle"></span>
    <span id="caffeinate-status" style="font-size:12px;color:var(--text2)"></span>
    <button class="btn" id="btn-caffeinate" onclick="toggleCaffeinate()">&#9889;</button>
    <button class="btn btn-primary" onclick="showNewModal()">+ New</button>
  </div>
</div>

<div class="sessions-bar" id="sessions-bar"></div>

<div class="terminal-wrap" id="terminal-wrap">
  <div class="empty-state" id="empty-state">
    <div class="icon">&#128187;</div>
    <div>No active session</div>
    <div style="font-size:13px">Tap <b>+ New</b> to start Claude Code</div>
  </div>
  <div id="terminal" style="display:none"></div>
  <button type="button" class="scroll-pill" id="scroll-pill" onclick="jumpToBottom()">↓ 新输出</button>
</div>

<div class="tts-panel" id="tts-panel">
  <div class="tts-head">
    <div>
      <span class="tts-label" id="tts-label">朗读</span>
      <span class="tts-status" id="tts-status"></span>
    </div>
    <button class="tts-close" onclick="closeTtsPanel()" title="关闭">&#10005;</button>
  </div>
  <div class="tts-text" id="tts-text"></div>
  <audio id="tts-audio" controls preload="none"></audio>
</div>

<div class="input-bar">
  <div class="nav-row">
    <button class="nav-btn" data-key="\x1b[D" data-repeat="1">&#9664;</button>
    <button class="nav-btn" data-key="\x1b[A" data-repeat="1">&#9650;</button>
    <button class="nav-btn" data-key="\x1b[B" data-repeat="1">&#9660;</button>
    <button class="nav-btn" data-key="\x1b[C" data-repeat="1">&#9654;</button>
    <button class="nav-btn enter" data-key="\r">Enter</button>
  </div>
  <div class="key-btns">
    <button class="key-btn" data-key="\t">Tab</button>
    <button class="key-btn" data-key="\x1b[Z">Shift+Tab</button>
    <button class="key-btn" data-key="\x1b">Esc</button>
    <button class="key-btn" data-key="\x03">Ctrl+C</button>
    <button class="key-btn refresh-btn" id="btn-refresh" onclick="refreshSession()" title="Refresh terminal" style="display:none">&#8635; Refresh</button>
  </div>
  <div class="speak-row" id="speak-row">
    <button class="key-btn speak-btn" id="btn-summarize" onclick="speakSummary()" title="摘要最后一条 Claude 消息并朗读" style="display:none">&#128221; 摘要朗读</button>
    <button class="key-btn stop-btn" id="btn-stop-tts" onclick="stopSpeak()" title="停止朗读" style="display:none">&#9209;</button>
  </div>
  <div class="input-row">
    <textarea id="cmd-input" rows="1" placeholder="Type here and press Enter..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="btn" onclick="sendInput()">Send</button>
  </div>
</div>

<!-- New Session Modal -->
<div class="modal-overlay" id="new-modal">
  <div class="modal">
    <h2>New Session</h2>
    <label>Working Directory</label>
    <input type="text" id="new-dir" placeholder="~/workspace/my-project">
    <div id="dir-suggestions" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px"></div>
    <label>Resume ID (optional)</label>
    <input type="text" id="new-resume" placeholder="Paste session ID to resume a conversation" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <label>Initial Prompt (optional)</label>
    <input type="text" id="new-prompt" placeholder="e.g. Refactor all components to TypeScript">
    <div class="toggle-row">
      <span style="font-size:13px">Auto Mode (skip permissions)</span>
      <button class="toggle" id="new-automode" onclick="this.classList.toggle('on')"></button>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="hideNewModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createSession()">Start</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-canvas@0.7.0/lib/addon-canvas.min.js"></script>
<script>
// --- Auth ---
let PASSWORD = localStorage.getItem('claude-remote-pass') || '';
if (!PASSWORD) {
  PASSWORD = prompt('Enter password:') || '';
  localStorage.setItem('claude-remote-pass', PASSWORD);
}
const AUTH = 'Basic ' + btoa('user:' + PASSWORD);

function api(method, path, body) {
  const opts = { method, headers: { 'Authorization': AUTH, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  return fetch('/api' + path, opts).then(r => {
    if (r.status === 401) { localStorage.removeItem('claude-remote-pass'); location.reload(); }
    return r.json();
  });
}

// --- Terminal ---
const term = new window.Terminal({
  fontSize: 14,
  fontFamily: 'Menlo, Monaco, Consolas, monospace',
  theme: { background: '#0d1117', foreground: '#e6edf3', cursor: '#58a6ff' },
  cursorBlink: false,          // disable blink → fewer redraws on mobile
  scrollback: 3000,            // trimmed from 5000 to reduce memory/scroll work
  convertEol: true,
  fastScrollModifier: 'shift',
  smoothScrollDuration: 0,     // no animation on scroll → instant
});
const fitAddon = new window.FitAddon.FitAddon();
term.loadAddon(fitAddon);

let currentSessionId = null;
let ws = null;
let sessionsData = [];
let caffeinateOn = false;

// --- Mount terminal ---
const termEl = document.getElementById('terminal');
const emptyEl = document.getElementById('empty-state');
term.open(termEl);

// Load the fastest renderer available: WebGL first, fall back to Canvas, else DOM.
// The DOM renderer is orders of magnitude slower on mobile — it creates one DOM
// node per character cell and repaints on every scroll.
(function loadFastRenderer() {
  try {
    if (window.WebglAddon && window.WebglAddon.WebglAddon) {
      const webgl = new window.WebglAddon.WebglAddon();
      webgl.onContextLoss(() => webgl.dispose());
      term.loadAddon(webgl);
      console.log('[term] using WebGL renderer');
      return;
    }
  } catch (e) {
    console.warn('[term] WebGL addon failed, falling back to Canvas:', e);
  }
  try {
    if (window.CanvasAddon && window.CanvasAddon.CanvasAddon) {
      term.loadAddon(new window.CanvasAddon.CanvasAddon());
      console.log('[term] using Canvas renderer');
      return;
    }
  } catch (e) {
    console.warn('[term] Canvas addon failed, falling back to DOM:', e);
  }
  console.log('[term] using default DOM renderer');
})();

function showTerminal() {
  termEl.style.display = 'block';
  emptyEl.style.display = 'none';
  document.getElementById('btn-refresh').style.display = '';
  document.getElementById('btn-summarize').style.display = '';
  document.getElementById('speak-row').classList.add('show');
  setTimeout(() => fitAddon.fit(), 50);
}
function hideTerminal() {
  termEl.style.display = 'none';
  emptyEl.style.display = 'flex';
  document.getElementById('btn-refresh').style.display = 'none';
  document.getElementById('btn-summarize').style.display = 'none';
  document.getElementById('btn-stop-tts').style.display = 'none';
  document.getElementById('speak-row').classList.remove('show');
  stopSpeak();
}

function refreshSession() {
  if (!currentSessionId) return;
  const btn = document.getElementById('btn-refresh');
  const original = btn.innerHTML;
  btn.textContent = '...';
  btn.disabled = true;
  connectSession(currentSessionId);
  setTimeout(() => {
    btn.innerHTML = original;
    btn.disabled = false;
  }, 800);
}

// Resize
window.addEventListener('resize', () => { if (currentSessionId) fitAddon.fit(); });
new ResizeObserver(() => { if (currentSessionId) fitAddon.fit(); }).observe(termEl);

// --- Activity indicator & smart auto-scroll ---
const activityDot = document.getElementById('activity-dot');
const scrollPill = document.getElementById('scroll-pill');
let activityTimer = null;

function markActivity() {
  activityDot.classList.add('active');
  activityDot.title = 'Receiving...';
  if (activityTimer) clearTimeout(activityTimer);
  activityTimer = setTimeout(() => {
    activityDot.classList.remove('active');
    activityDot.title = 'Idle';
  }, 1500);
}

function isAtBottom() {
  // xterm public buffer API: viewportY is the top of the visible area,
  // baseY is the top of the most recent screen. Equal ⇒ at bottom.
  const buf = term.buffer.active;
  return buf.viewportY >= buf.baseY;
}

function jumpToBottom() {
  term.scrollToBottom();
  scrollPill.classList.remove('show');
}
window.jumpToBottom = jumpToBottom;

// If the user manually scrolls back to the bottom, hide the pill.
term.onScroll(() => {
  if (isAtBottom()) scrollPill.classList.remove('show');
});

// --- WebSocket ---
function connectSession(id) {
  if (ws) { ws.close(); ws = null; }
  currentSessionId = id;
  term.clear();
  term.reset();
  scrollPill.classList.remove('show');
  showTerminal();

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?session=${id}&token=${encodeURIComponent(PASSWORD)}`);
  ws.onmessage = (e) => {
    const atBottomBefore = isAtBottom();
    term.write(e.data);
    // If the user was scrolled up reading history when new data arrived,
    // surface a "new output" pill so they know there's more below.
    // (When at bottom, xterm auto-scrolls — no pill needed.)
    if (!atBottomBefore && !scrollPill.classList.contains('show')) {
      scrollPill.classList.add('show');
      vibrate(15);
    }
    markActivity();
  };
  ws.onclose = () => {
    if (activityTimer) { clearTimeout(activityTimer); activityTimer = null; }
    activityDot.classList.remove('active');
    activityDot.title = 'Disconnected';
  };
  ws.onerror = () => {};

  // Resize PTY
  setTimeout(() => {
    fitAddon.fit();
    api('POST', `/sessions/${id}/resize`, { cols: term.cols, rows: term.rows });
  }, 100);

  updateTabs();
}

// Terminal input → WS
term.onData((data) => {
  if (ws && ws.readyState === 1) ws.send(data);
});

// --- Sessions ---
async function loadSessions() {
  sessionsData = await api('GET', '/sessions');
  updateTabs();
}

function updateTabs() {
  const bar = document.getElementById('sessions-bar');
  bar.innerHTML = '';
  for (const s of sessionsData) {
    const tab = document.createElement('div');
    tab.className = 'session-tab' + (s.id === currentSessionId ? ' active' : '');
    const dirName = s.directory.split('/').filter(Boolean).pop() || s.directory;
    tab.innerHTML = `<span class="status-dot ${s.status}"></span>${dirName}<span class="close-btn" data-id="${s.id}">&times;</span>`;
    tab.onclick = (e) => {
      if (e.target.classList.contains('close-btn')) {
        killSession(e.target.dataset.id);
      } else {
        connectSession(s.id);
      }
    };
    bar.appendChild(tab);
  }
}

async function killSession(id) {
  if (!confirm('Stop this session?')) return;
  await api('DELETE', `/sessions/${id}`);
  if (id === currentSessionId) {
    if (ws) ws.close();
    currentSessionId = null;
    hideTerminal();
  }
  await loadSessions();
}

// --- New session ---
async function showNewModal() {
  document.getElementById('new-modal').classList.add('show');
  document.getElementById('new-dir').focus();
  // Load directory suggestions
  const data = await api('GET', '/directories');
  renderDirSuggestions(data.entries, data.base);
}

function renderDirSuggestions(entries, base) {
  const el = document.getElementById('dir-suggestions');
  el.innerHTML = '';
  // Up button if not home
  if (base !== (base.split('/').slice(0,3).join('/'))) {
    const up = document.createElement('button');
    up.className = 'btn'; up.style.fontSize = '12px'; up.style.padding = '4px 8px';
    up.textContent = '..';
    up.onclick = async () => {
      const parent = base.split('/').slice(0,-1).join('/') || '/';
      const data = await api('GET', `/directories?path=${encodeURIComponent(parent)}`);
      renderDirSuggestions(data.entries, data.base);
    };
    el.appendChild(up);
  }
  for (const e of entries) {
    const btn = document.createElement('button');
    btn.className = 'btn'; btn.style.fontSize = '12px'; btn.style.padding = '4px 8px';
    btn.textContent = e.name;
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      document.getElementById('new-dir').value = e.path;
      // Drill into subdirectory
      const data = await api('GET', `/directories?path=${encodeURIComponent(e.path)}`);
      renderDirSuggestions(data.entries, data.base);
    };
    el.appendChild(btn);
  }
}
function hideNewModal() {
  document.getElementById('new-modal').classList.remove('show');
  // Clear resume ID on close so a Cancel doesn't silently resume next time
  document.getElementById('new-resume').value = '';
}

async function createSession() {
  const dir = document.getElementById('new-dir').value.trim() || '~';
  const prompt = document.getElementById('new-prompt').value.trim();
  const resumeId = document.getElementById('new-resume').value.trim();
  const autoMode = document.getElementById('new-automode').classList.contains('on');

  hideNewModal();
  const session = await api('POST', '/sessions', {
    directory: dir === '~' ? undefined : dir,
    autoMode,
    resumeId: resumeId || undefined,
  });
  sessionsData.push(session);
  connectSession(session.id);

  // Send initial prompt after a delay (resume opens an existing conversation, so skip)
  if (prompt && !resumeId) {
    setTimeout(() => {
      if (ws && ws.readyState === 1) ws.send(prompt + '\r');
    }, 2000);
  }
}

// --- Input bar ---
const cmdInput = document.getElementById('cmd-input');
cmdInput.addEventListener('keydown', (e) => {
  // Shift+Enter inserts a newline; plain Enter submits.
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendInput(); }
});

function sendInput() {
  const val = cmdInput.value;
  if (!val || !ws || ws.readyState !== 1) return;
  // For multi-line input, wrap in bracketed-paste so embedded newlines don't
  // each trigger submit in the TUI. Single-line keeps original behavior.
  if (val.includes('\n')) {
    ws.send('\x1b[200~' + val + '\x1b[201~\r');
  } else {
    ws.send(val + '\r');
  }
  cmdInput.value = '';
}

function sendKey(key) {
  if (ws && ws.readyState === 1) ws.send(key);
}

// Decode data-key escape strings like "\x1b[A" or "\r" into actual characters
function decodeKey(s) {
  return s
    .replace(/\\x([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/\\r/g, '\r')
    .replace(/\\n/g, '\n')
    .replace(/\\t/g, '\t');
}

function vibrate(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch {} }
}

// Wire up any button with data-key for: immediate send, visual press state,
// haptic feedback, and (if data-repeat) long-press auto-repeat.
function wireKeyButton(btn) {
  const key = decodeKey(btn.dataset.key || '');
  const canRepeat = btn.dataset.repeat === '1';
  if (!key) return;

  let holdTimer = null;
  let repeatTimer = null;

  const press = (e) => {
    e.preventDefault();
    // Dismiss the soft keyboard so nav/shortcut keys don't fight with the
    // on-screen keyboard popping up from the focused textarea.
    if (document.activeElement === cmdInput) cmdInput.blur();
    btn.classList.add('pressed');
    vibrate(10);
    sendKey(key);
    if (canRepeat) {
      holdTimer = setTimeout(() => {
        repeatTimer = setInterval(() => sendKey(key), 80);
      }, 300);
    }
    // Capture so we still get pointerup if the finger slides off the button
    if (e.pointerId !== undefined && btn.setPointerCapture) {
      try { btn.setPointerCapture(e.pointerId); } catch {}
    }
  };

  const release = () => {
    btn.classList.remove('pressed');
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
  };

  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);
  // Swallow the synthesized click so it doesn't steal focus from the text input
  btn.addEventListener('click', (e) => e.preventDefault());
}

document.querySelectorAll('[data-key]').forEach(wireKeyButton);

// --- TTS (server-side via DashScope Qwen-TTS) ---
// Flow: fetch last Claude message (or its summary) -> POST /api/tts ->
// receive audio bytes -> play through <audio> element in #tts-panel. The
// panel also shows the exact text so the user can see what's being spoken.
const ttsAudio = document.getElementById('tts-audio');
let ttsObjectUrl = null;

function setTtsStatus(msg) {
  document.getElementById('tts-status').textContent = msg || '';
}

function showTtsPanel(label, text) {
  document.getElementById('tts-label').textContent = label;
  document.getElementById('tts-text').textContent = text;
  document.getElementById('tts-panel').classList.add('show');
}

function closeTtsPanel() {
  ttsAudio.pause();
  if (ttsObjectUrl) { URL.revokeObjectURL(ttsObjectUrl); ttsObjectUrl = null; }
  ttsAudio.removeAttribute('src');
  ttsAudio.load();
  document.getElementById('tts-panel').classList.remove('show');
  document.getElementById('btn-stop-tts').style.display = 'none';
  setTtsStatus('');
}
window.closeTtsPanel = closeTtsPanel;

function stopSpeak() {
  ttsAudio.pause();
  document.getElementById('btn-stop-tts').style.display = 'none';
}
window.stopSpeak = stopSpeak;

async function fetchLastMessage() {
  if (!currentSessionId) return null;
  try {
    const r = await fetch(`/api/sessions/${currentSessionId}/last-message`, {
      headers: { 'Authorization': AUTH },
    });
    if (!r.ok) { alert('取最后消息失败: ' + r.status); return null; }
    const data = await r.json();
    return data.text || '';
  } catch (e) {
    alert('网络错误: ' + e.message);
    return null;
  }
}

// POST text to /api/tts, receive audio blob, play it. Must be invoked inside
// a user gesture (button click) so iOS Safari allows audio.play() without
// prompting.
async function ttsPlay(text) {
  setTtsStatus('合成中...');
  let r;
  try {
    r = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Authorization': AUTH, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
  } catch (e) {
    setTtsStatus('网络错误');
    alert('TTS 网络错误: ' + e.message);
    return;
  }
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch {}
    setTtsStatus('失败');
    alert('TTS 失败: ' + msg);
    return;
  }
  const blob = await r.blob();
  if (ttsObjectUrl) URL.revokeObjectURL(ttsObjectUrl);
  ttsObjectUrl = URL.createObjectURL(blob);
  ttsAudio.src = ttsObjectUrl;
  setTtsStatus('播放中');
  document.getElementById('btn-stop-tts').style.display = '';
  try {
    await ttsAudio.play();
  } catch (e) {
    setTtsStatus('点击 ▶ 播放');
  }
}

ttsAudio.addEventListener('ended', () => {
  setTtsStatus('播放完毕');
  document.getElementById('btn-stop-tts').style.display = 'none';
});
ttsAudio.addEventListener('pause', () => {
  if (!ttsAudio.ended) setTtsStatus('已暂停');
});
ttsAudio.addEventListener('play', () => setTtsStatus('播放中'));

async function speakSummary() {
  if (document.activeElement === cmdInput) cmdInput.blur();
  const btn = document.getElementById('btn-summarize');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const text = await fetchLastMessage();
    if (text == null) return;
    if (!text.trim()) { alert('没有可摘要的内容'); return; }
    showTtsPanel('📝 正在摘要', '(原文 ' + text.length + ' 字) ' + text.slice(0, 200) + (text.length > 200 ? '…' : ''));
    setTtsStatus('摘要中...');
    const resp = await api('POST', '/summarize', { text });
    if (resp.error) { setTtsStatus('摘要失败'); alert('摘要失败: ' + resp.error); return; }
    if (!resp.summary) { setTtsStatus('空摘要'); alert('模型返回空摘要'); return; }
    showTtsPanel('📝 摘要', resp.summary);
    await ttsPlay(resp.summary);
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}
window.speakSummary = speakSummary;

// --- Caffeinate ---
async function loadStatus() {
  const st = await api('GET', '/status');
  caffeinateOn = st.caffeinate === 'running';
  updateCaffeinateUI();
}

function updateCaffeinateUI() {
  const btn = document.getElementById('btn-caffeinate');
  const st = document.getElementById('caffeinate-status');
  if (caffeinateOn) {
    btn.style.background = 'var(--yellow)';
    btn.style.borderColor = 'var(--yellow)';
    st.textContent = 'Awake';
  } else {
    btn.style.background = '';
    btn.style.borderColor = '';
    st.textContent = '';
  }
}

async function toggleCaffeinate() {
  if (caffeinateOn) {
    await api('POST', '/caffeinate/stop');
    caffeinateOn = false;
  } else {
    await api('POST', '/caffeinate/start');
    caffeinateOn = true;
  }
  updateCaffeinateUI();
}

// --- Event stream ---
function connectEvents() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const evtWs = new WebSocket(`${proto}://${location.host}/ws/events?token=${encodeURIComponent(PASSWORD)}`);
  evtWs.onmessage = (e) => {
    const evt = JSON.parse(e.data);
    if (evt.type === 'session_created' || evt.type === 'session_stopped' || evt.type === 'session_deleted') {
      loadSessions();
    }
  };
  evtWs.onclose = () => setTimeout(connectEvents, 3000);
}

// --- Init ---
(async () => {
  await loadSessions();
  await loadStatus();
  connectEvents();
  if (sessionsData.length > 0) {
    const running = sessionsData.find(s => s.status === 'running');
    if (running) connectSession(running.id);
  }
})();
</script>
</body>
